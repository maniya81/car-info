<div class="container mt-5">
  <h1 class="text-center mb-4">Contact Us</h1>
  <p class="text-center">
    We'd love to hear from you! Fill out the form below and we'll get back to you soon.
  </p>
  <div class="row mt-5">
    <!-- Contact Form -->
    <div class="col-md-6 mb-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h4 class="card-title mb-3">Send a Message</h4>
          <form>
            <div class="mb-3">
              <label for="name" class="form-label">Name</label>
              <input
                type="text"
                class="form-control"
                id="name"
                placeholder="Your Name"
                required />
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email</label>
              <input
                type="email"
                class="form-control"
                id="email"
                placeholder="Your Email"
                required />
            </div>
            <div class="mb-3">
              <label for="message" class="form-label">Message</label>
              <textarea
                class="form-control"
                id="message"
                rows="5"
                placeholder="Type your message..."
                required></textarea>
            </div>
            <button type="submit" class="btn btn-primary w-100">Send</button>
          </form>
        </div>
      </div>
    </div>
    <!-- Contact Info -->
    <div class="col-md-6 mb-4">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <h4 class="card-title mb-3">Contact Information</h4>
          <ul class="list-unstyled mb-4">
            <li class="mb-2">
              <i class="fa fa-map-marker-alt me-2 text-primary"></i> 123 Main Street,
              City, Country
            </li>
            <li class="mb-2">
              <i class="fa fa-phone me-2 text-primary"></i> +1 234 567 890
            </li>
            <li class="mb-2">
              <i class="fa fa-envelope me-2 text-primary"></i> contact@carinfo.com
            </li>
          </ul>
          <h5 class="mb-3">Follow Us</h5>
          <div class="d-flex flex-wrap gap-2">
            <a
              href="https://www.linkedin.com/in/maniyasagar/"
              target="_blank"
              class="btn btn-outline-primary btn-sm"
              title="LinkedIn">
              <i class="fa fa-linkedin-square"></i> Maniya Sagar
            </a>
            <a
              href="https://x.com/maniyasagar25"
              target="_blank"
              class="btn btn-outline-info btn-sm"
              title="Twitter">
              <i class="fa fa-twitter"></i> @maniyasagar25
            </a>
            <a
              href="http://github.com/maniya81/car-info"
              target="_blank"
              class="btn btn-outline-dark btn-sm"
              title="GitHub">
              <i class="fa fa-github"></i> GitHub Repo
            </a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
